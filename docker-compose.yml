#
# docker-compose.yml for Hermes Agent
#
# Usage:
#   HERMES_UID=$(id -u) HERMES_GID=$(id -g) docker compose up -d
#
# Set HERMES_UID / HERMES_GID to the host user that owns ~/.hermes so
# files created inside the container stay readable/writable on the host.
# The s6-overlay stage2 hook remaps the internal `hermes` user to these
# values via usermod/groupmod; each supervised service then drops to that
# user via `s6-setuidgid`.
#
# Security notes:
#   - The dashboard service binds to 127.0.0.1 by default. It stores API
#     keys; exposing it on LAN without auth is unsafe. If you want remote
#     access, use an SSH tunnel or put it behind a reverse proxy that
#     adds authentication — do NOT pass --insecure --host 0.0.0.0.
#   - If you override entrypoint, keep `/init` as the first command in
#     the chain (or let docker use the image's default ENTRYPOINT,
#     which is `["/init", "/opt/hermes/docker/main-wrapper.sh"]`).
#     `/init` is s6-overlay's PID 1 — it runs the cont-init.d scripts
#     (chown, profile reconcile, dashboard toggle) and sets up the
#     supervision tree before any service starts. Bypassing it skips
#     all of that setup and the gateway will not work correctly.
#   - The gateway's API server is off unless you uncomment API_SERVER_KEY
#     and API_SERVER_HOST. See docs/user-guide/api-server.md before doing
#     this on an internet-facing host.
#
services:
  gateway:
    build: .
    image: hermes-agent
    container_name: hermes
    restart: unless-stopped
    network_mode: host
    volumes:
      - ~/.hermes:/opt/data
      # Obsidian vault, kept in sync onto the host by Syncthing. Mounted
      # read-write so the agent can read/search and also create/edit notes.
      # NOTE: concurrent edits with Obsidian Sync can cause sync conflicts.
      # OBSIDIAN_VAULT_PATH in ~/.hermes/.env points the obsidian skill here.
      - ~/obsidian-vault:/opt/obsidian-vault:rw
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
      # To expose the OpenAI-compatible API server beyond localhost,
      # uncomment BOTH lines (API_SERVER_KEY is mandatory for auth):
      # - API_SERVER_HOST=0.0.0.0
      # - API_SERVER_KEY=${API_SERVER_KEY}
      # Microsoft Teams — uncomment and fill in to enable Teams gateway.
      # Register your bot at https://dev.botframework.com/ to get these values.
      # - TEAMS_CLIENT_ID=${TEAMS_CLIENT_ID}
      # - TEAMS_CLIENT_SECRET=${TEAMS_CLIENT_SECRET}
      # - TEAMS_TENANT_ID=${TEAMS_TENANT_ID}
      # - TEAMS_ALLOWED_USERS=${TEAMS_ALLOWED_USERS}
      # - TEAMS_PORT=${TEAMS_PORT:-3978}
      # Google Chat — uncomment and fill in to enable the Google Chat gateway.
      # See website/docs/user-guide/messaging/google_chat.md for the full setup.
      # The SA JSON path must point to a file mounted into the container —
      # add a volume entry above (e.g. ``- ~/.hermes/google-chat-sa.json:/secrets/google-chat-sa.json:ro``)
      # then set GOOGLE_CHAT_SERVICE_ACCOUNT_JSON to that mount path.
      # - GOOGLE_CHAT_PROJECT_ID=${GOOGLE_CHAT_PROJECT_ID}
      # - GOOGLE_CHAT_SUBSCRIPTION_NAME=${GOOGLE_CHAT_SUBSCRIPTION_NAME}
      # - GOOGLE_CHAT_SERVICE_ACCOUNT_JSON=${GOOGLE_CHAT_SERVICE_ACCOUNT_JSON}
      # - GOOGLE_CHAT_ALLOWED_USERS=${GOOGLE_CHAT_ALLOWED_USERS}
    command: ["gateway", "run"]

  dashboard:
    image: hermes-agent
    container_name: hermes-dashboard
    restart: unless-stopped
    network_mode: host
    depends_on:
      - gateway
    volumes:
      - ~/.hermes:/opt/data
      # Same read-write Obsidian vault mount as the gateway, so agent sessions
      # driven from Hermes Desktop (which talks to this dashboard backend) can
      # read and edit the notes too.
      - ~/obsidian-vault:/opt/obsidian-vault:rw
    environment:
      - HERMES_UID=${HERMES_UID:-10000}
      - HERMES_GID=${HERMES_GID:-10000}
      # This container only serves the web dashboard; it must NOT also start
      # the messaging gateway (would clash with the `hermes` gateway on the
      # SMS webhook port 8080 and double-poll Telegram). container_boot reads
      # this to skip per-profile gateway reconciliation here.
      - HERMES_CONTAINER_ROLE=dashboard
      # Pinned session token (value in the gitignored project .env). In the
      # no-login/loopback-token mode below, the dashboard normally mints a
      # RANDOM _SESSION_TOKEN each start and injects it into the SPA HTML —
      # fine for a browser, but Hermes Desktop ships its own frontend and uses
      # the remote purely as an API backend, so it never reads that HTML token
      # and every /api call 401s (renderer reset-loop). Pinning the token to a
      # known value lets Desktop authenticate: paste the SAME value into
      # Desktop's remote-connection "session token" field and it sends it as
      # X-Hermes-Session-Token on every call. Browser access stays login-free
      # (the SPA still gets the token injected into its HTML).
      - HERMES_DASHBOARD_SESSION_TOKEN=${HERMES_DASHBOARD_SESSION_TOKEN}
    # Bound to the host's Tailscale MagicDNS name, which resolves to the
    # tailscale0 IP (100.x) — so the dashboard listens only on the tailnet
    # interface, never on the public/LAN interface. Binding to the *name*
    # (not the IP) makes the app's anti-DNS-rebinding Host check accept the
    # same name that `tailscale serve` forwards, so HTTPS-by-name works.
    # VPN-as-auth: access is already restricted to the tailnet (binds to the
    # 100.x MagicDNS address, no Funnel), so we treat the VPN as the auth
    # boundary and skip the in-app login. The shim disables the auth gate
    # before start; see ~/.hermes/dashboard_nologin.py (mounted at /opt/data).
    # Desktop authenticates via the pinned HERMES_DASHBOARD_SESSION_TOKEN above.
    # To restore the in-app basic-auth "Sign in" gate instead, swap to:
    #   command: ["dashboard", "--host", "lynhacel-server-1.tailff0b7c.ts.net", "--port", "10001", "--no-open"]
    # Port 10001 (not the 9119 default); hermes-workspace's .env HERMES_DASHBOARD_URL must match.
    command: ["python", "/opt/data/dashboard_nologin.py", "--host", "lynhacel-server-1.tailff0b7c.ts.net", "--port", "10001", "--no-open"]
